<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chetan News Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:1000px;
margin:auto;
padding:20px;
background:#f4f4f4;
}

h1{
text-align:center;
}

button{
padding:10px 20px;
font-size:16px;
cursor:pointer;
margin-bottom:20px;
}

.news{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.news img{
max-width:100%;
border-radius:8px;
}

.news a{
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>

<h1>📰 Chetan News Dashboard</h1>

<button onclick="loadNews()">🔄 Refresh News</button>

<div id="news">Loading...</div>

<script>

const API_KEY = "ac690db7e53dcee1ff7d40b37dafce07";

const QUERY =
'India OR cricket OR RCB OR technology OR AI OR finance OR stocks OR "One Piece"';

async function loadNews(){

try{

const url =
"https://my-news-api.cnucchi.workers.dev/";

const response = await fetch(url);

const data = await response.json();

let html = "";

if(!data.articles){
document.getElementById("news").innerHTML =
"Unable to fetch news.";
return;
}

data.articles.forEach(article=>{

html += `
<div class="news">
<h3>${article.title}</h3>

<img src="${article.image || ''}">

<p>${article.description || ''}</p>

<a href="${article.url}" target="_blank">
Read Full Article →
</a>
</div>
`;

});

document.getElementById("news").innerHTML = html;

}
catch(error){

document.getElementById("news").innerHTML =
"Error loading news.";

console.log(error);

}

}

loadNews();

</script>

</body>
</html>
