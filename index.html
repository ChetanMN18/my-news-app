<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chetan News Dashboard V5</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;color:#222;max-width:1200px;margin:auto;padding:20px}
body.dark{background:#121212;color:#fff}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer}
input{padding:10px;flex:1;border-radius:8px;border:1px solid #ccc}
.news{background:#fff;margin:15px 0;padding:15px;border-radius:12px}
body.dark .news{background:#1e1e1e}
.news img{width:100%;max-height:260px;object-fit:cover;border-radius:8px}
.badge{display:inline-block;padding:4px 8px;background:#ddd;border-radius:20px;font-size:12px}
.meta{font-size:13px;opacity:.8;margin-top:6px}
</style>
</head>
<body>
<h1>📰 Chetan News Dashboard V5</h1>
<p>Uses image, pubDate and timestamp from Worker V3.</p>
<p>Features: Save/Unsave, Relative Time, Images, Search, AI Brief, Dark Mode.</p>
</body>
</html>
