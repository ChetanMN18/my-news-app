<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chetan News Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
max-width:1000px;
margin:auto;
padding:20px;
transition:0.3s;
}

h1{text-align:center;}

button{
padding:10px 15px;
font-size:14px;
cursor:pointer;
margin:5px;
border:none;
border-radius:8px;
background:#007bff;
color:white;
}

.news{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.news img{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:8px;
}

.dark{
background:#121212;
color:white;
}

.dark .news{
background:#1e1e1e;
color:white;
}

.dark a{
color:#4da6ff;
}
</style>
</head>

<body>

<h1>📰 Chetan News Dashboard</h1>

<button onclick="toggleTheme()">🌙 Dark Mode</button>

<div style="margin-bottom:20px;">
<button onclick="loadNews('all')">🏠 All</button>
<button onclick="loadNews('cricket')">🏏 Cricket</button>
<button onclick="loadNews('ai')">🤖 AI</button>
<button onclick="loadNews('finance')">💰 Finance</button>
<button onclick="loadNews('india')">🇮🇳 India</button>
<button onclick="loadNews('onepiece')">☠️ One Piece</button>
<button onclick="loadNews(currentTopic)">🔄 Refresh</button>
</div>

<div id="news">Loading...</div>

<script>
let currentTopic = "all";

function toggleTheme(){
 document.body.classList.toggle("dark");
}

async function loadNews(topic='all'){
 currentTopic = topic;
 const newsDiv = document.getElementById("news");
 newsDiv.innerHTML = "Loading news...";

 try{
   const response = await fetch(
   `https://my-news-api.cnucchi.workers.dev/?topic=${topic}`
   );

   const data = await response.json();

   let articles = [];
   if(Array.isArray(data)){
      articles = data;
   } else if(data.articles){
      articles = data.articles;
   }

   if(articles.length === 0){
      newsDiv.innerHTML = "No articles found.";
      return;
   }

   const seenTitles = new Set();

   articles = articles.filter(article => {
      const title = (article.title || "").toLowerCase().trim();
      if(seenTitles.has(title)) return false;
      seenTitles.add(title);
      return true;
   });

   let html = "";

   articles.forEach(article => {
      html += `
      <div class="news">
        <h3>${article.title || "No title"}</h3>
        ${article.image ? `<img src="${article.image}" alt="">` : ""}
        <p>${article.description || ""}</p>
        <a href="${article.url}" target="_blank">Read Full Article →</a>
      </div>`;
   });

   newsDiv.innerHTML = html;

 } catch(error){
   console.error(error);
   newsDiv.innerHTML = "Error loading news: " + error.message;
 }
}

loadNews('all');
</script>

</body>
</html>
