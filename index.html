<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chetan News Dashboard</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
color:#222;
max-width:1200px;
margin:auto;
padding:20px;
transition:.3s;
}

body.dark{
background:#121212;
color:#fff;
}

h1{
text-align:center;
}

.controls{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

button{
padding:10px 15px;
cursor:pointer;
border:none;
border-radius:8px;
}

input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
flex:1;
min-width:220px;
}

.news{
background:white;
padding:15px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

body.dark .news{
background:#1e1e1e;
}

.news h3{
margin-top:0;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
font-size:12px;
background:#ddd;
margin-bottom:10px;
}

body.dark .badge{
background:#333;
}

.news-actions{
margin-top:10px;
display:flex;
gap:10px;
}

a{
text-decoration:none;
}

#aiBrief{
background:#fff3cd;
padding:15px;
border-radius:12px;
margin-bottom:20px;
}

body.dark #aiBrief{
background:#2c2c2c;
}

</style>

</head>

<body>

<h1>📰 Chetan News Dashboard</h1>

<div class="controls">

<button onclick="toggleTheme()">🌙 Dark Mode</button>

<button onclick="loadNews('all')">🏠 All</button>

<button onclick="loadNews('india')">🇮🇳 India</button>

<button onclick="loadNews('cricket')">🏏 Cricket</button>

<button onclick="loadNews('ai')">🤖 AI</button>

<button onclick="loadNews('finance')">💰 Finance</button>

<button onclick="loadNews('onepiece')">☠️ One Piece</button>

<button onclick="loadNews('world')">🌍 World</button>

<button onclick="loadNews('positive')">😊 Positive</button>

<button onclick="showSaved()">⭐ Saved</button>

</div>

<div class="controls">

<input
type="text"
id="searchBox"
placeholder="Search news..."
onkeyup="searchNews()">

</div>

<div id="aiBrief">

<h2>🧠 Today's AI Brief</h2>

<ul id="briefList">
<li>Loading AI news...</li>
</ul>

</div>

<div id="news">
Loading...
</div>

<script>

const API =
"https://my-news-api.cnucchi.workers.dev";

let allArticles = [];

async function loadNews(topic='all'){

const newsDiv =
document.getElementById("news");

newsDiv.innerHTML =
"Loading news...";

try{

const response =
await fetch(`${API}?topic=${topic}`);

const articles =
await response.json();

allArticles = articles;

renderNews(articles);

if(topic === 'ai'){
generateBrief(articles);
}

}
catch(error){

console.error(error);

newsDiv.innerHTML =
"Error loading news.";

}

}

function renderNews(articles){

const newsDiv =
document.getElementById("news");

if(!articles.length){

newsDiv.innerHTML =
"No articles found.";

return;

}

let html = "";

articles.forEach(article=>{

html += `

<div class="news">

<div class="badge">
${article.category.toUpperCase()}
</div>

<h3>${article.title}</h3>

<p>${article.description}</p>

<small>
${article.source}
</small>

<div class="news-actions">

<a href="${article.link}"
target="_blank">

<button>
📖 Read
</button>

</a>

<button
onclick='saveArticle(${JSON.stringify(article)})'>
⭐ Save
</button>

</div>

</div>

`;

});

newsDiv.innerHTML = html;

}

function searchNews(){

const term =
document.getElementById("searchBox")
.value
.toLowerCase();

const filtered =
allArticles.filter(article =>

article.title
.toLowerCase()
.includes(term)

||

article.description
.toLowerCase()
.includes(term)

);

renderNews(filtered);

}

function saveArticle(article){

let saved =

JSON.parse(
localStorage.getItem("savedNews")
|| "[]"
);

const exists =

saved.some(item =>
item.link === article.link
);

if(!exists){

saved.push(article);

localStorage.setItem(
"savedNews",
JSON.stringify(saved)
);

alert("Saved!");

}

}

function showSaved(){

const saved =

JSON.parse(
localStorage.getItem("savedNews")
|| "[]"
);

renderNews(saved);

}

function generateBrief(articles){

const briefList =
document.getElementById("briefList");

const topFive =
articles.slice(0,5);

briefList.innerHTML = "";

topFive.forEach(article=>{

briefList.innerHTML +=
`<li>${article.title}</li>`;

});

}

function toggleTheme(){

document.body.classList.toggle("dark");

localStorage.setItem(
"theme",
document.body.classList.contains("dark")
? "dark"
: "light"
);

}

if(
localStorage.getItem("theme")
=== "dark"
){
document.body.classList.add("dark");
}

loadNews();

</script>

</body>
</html>
