<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chetan News Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
max-width:1000px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
}

button{
padding:12px 20px;
font-size:16px;
cursor:pointer;
margin-bottom:20px;
}

.news{
background:white;
padding:15px;
margin:15px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.news img{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:8px;
}
</style>

</head>

<body>

<h1>📰 Chetan News Dashboard</h1>

<button onclick="loadNews()">🔄 Refresh News</button>

<div id="news">Loading...</div>

<script>

async function loadNews(){

const newsDiv = document.getElementById("news");
newsDiv.innerHTML = "Loading news...";

try{

const response = await fetch(
"https://my-news-api.cnucchi.workers.dev/"
);

const data = await response.json();

let articles = [];

if(Array.isArray(data)){
articles = data;
}
else if(data.articles){
articles = data.articles;
}

if(articles.length === 0){
newsDiv.innerHTML = "No articles found.";
return;
}

let html = "";

articles.forEach(article => {

html += `
<div class="news">

<h3>${article.title || "No title"}</h3>

${article.image ?
`<img src="${article.image}" alt="">`
: ""}

<p>${article.description || ""}</p>

<a href="${article.url}" target="_blank">
Read Full Article →
</a>

</div>
`;

});

newsDiv.innerHTML = html;

}
catch(error){

console.error(error);

newsDiv.innerHTML =
"Error loading news: " + error.message;

}
}

loadNews();

</script>

</body>
</html>
